<nav class="nav">
  <a href="{{ "/" | relURL }}" class="nav-logo">
    <img src="{{ print "images/" .Site.Params.logo.url | relURL }}"
         width="{{ .Site.Params.logo.width }}"
         height="{{ .Site.Params.logo.height }}"
         alt="{{ .Site.Params.logo.alt }}">
  </a>

  <ul class="nav-links">
    {{ range .Site.Menus.main }}
      {{ if .Params }}
        <li><a href="{{ .URL }}"><img src="{{ .Params.PATH }}" onerror="this.style.display='none'" alt={{ .Name }} style="width:35px;height:35px"></a></li>
      {{ else }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
      {{ end }}
    
    {{ end }}
  </ul>
</nav>
