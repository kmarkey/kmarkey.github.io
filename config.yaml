baseurl: /
languageCode: en-US
title: Keaton Markey | Portfolio Website
theme: hugo-lithium
googleAnalytics: ''
disqusShortname: ''
publishDir: /docs
ignoreFiles:
  - \.Rmd$
  - \.Rmarkdown$
  - _cache$
permalinks:
  post: /:year/:month/:day/:slug/
menu:
  main:
    - name: About
      url: /about/
      weight: 10
    - name: Kaggle
      url: https://www.kaggle.com/kmarkey
      weight: 20
    - name: Github
      url: https://github.com/kmarkey?tab=repositories
      params:
        path: /logos/github-mark.png
      weight: 31
    - name: LinkedIn
      url: https://www.linkedin.com/in/keaton-markey-7822b3205/
      params:
        path: /logos/LI-In-Bug.png
      weight: 40
    - name: Tableau
      url: https://public.tableau.com/app/profile/keaton.markey5262/vizzes
      params:
        path: /logos/tableau_logo.png
      weight: 30
params:
  MathJaxCDN: //cdnjs.cloudflare.com/ajax/libs
  MathJaxVersion: 2.7.5
  description: A website built through Hugo and blogdown.
  favicon: favicon.ico
  highlightjsCDN: //cdnjs.cloudflare.com/ajax/libs
  highlightjsLang:
    - r
    - yaml
  highlightjsTheme: github
  highlightjsVersion: 9.12.0
  logo:
    alt: Logo
    height: 50
    url: logo.png
    width: 50
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: yes
  highlight:
    codeFences: no